# Managed via Web UI / API - manual comments are not preserved
defaults:
  mirror_url: http://mirror.biznetgio.com
  disk_size: 20G
distros:
  ubuntu:
    label: Ubuntu
    family: deb
    versions:
      '24.04':
        codename: noble
        kernel_pkg: linux-image-virtual
        filename: ubuntu-24.04-minimal-cloudimg-amd64.img
        image_url: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
        sums_algo: sha256
        sums_url: https://cloud-images.ubuntu.com/minimal/releases/noble/release/SHA256SUMS
      '22.04':
        codename: jammy
        kernel_pkg: linux-image-virtual
        filename: ubuntu-22.04-minimal-cloudimg-amd64.img
        image_url: https://cloud-images.ubuntu.com/minimal/releases/jammy/release/ubuntu-22.04-minimal-cloudimg-amd64.img
        sums_algo: sha256
        sums_url: https://cloud-images.ubuntu.com/minimal/releases/jammy/release/SHA256SUMS
      '26.04':
        image_url: https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img
        sums_url: https://cloud-images.ubuntu.com/resolute/current/SHA256SUMS
        sums_algo: sha256
        filename: resolute-server-cloudimg-amd64.img
        codename: '26.04'
        kernel_pkg: linux-image-virtual
  debian:
    label: Debian
    family: deb
    versions:
      '13':
        codename: trixie
        kernel_pkg: linux-image-amd64
        filename: debian-13-generic-amd64.qcow2
        image_url: https://cdimage.debian.org/cdimage/cloud/trixie/latest/debian-13-generic-amd64.qcow2
        sums_algo: sha512
        sums_url: https://cdimage.debian.org/cdimage/cloud/trixie/latest/SHA512SUMS
      '12':
        codename: bookworm
        kernel_pkg: linux-image-amd64
        filename: debian-12-generic-amd64.qcow2
        image_url: https://cdimage.debian.org/cdimage/cloud/bookworm/latest/debian-12-generic-amd64.qcow2
        sums_algo: sha512
        sums_url: https://cdimage.debian.org/cdimage/cloud/bookworm/latest/SHA512SUMS
      '11':
        codename: bullseye
        kernel_pkg: linux-image-amd64
        filename: debian-11-generic-amd64.qcow2
        image_url: https://cdimage.debian.org/cdimage/cloud/bullseye/latest/debian-11-generic-amd64.qcow2
        sums_algo: sha512
        sums_url: https://cdimage.debian.org/cdimage/cloud/bullseye/latest/SHA512SUMS
  rocky:
    label: Rocky Linux
    family: rpm
    repo_dir: rocky
    gpg_key_id: RPM-GPG-KEY-Rocky
    upstream_key_url: https://download.rockylinux.org/pub/rocky
    versions:
      '10':
        filename: Rocky-10-GenericCloud-Base.latest.x86_64.qcow2
        image_url: https://download.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2
        sums_url: https://download.rockylinux.org/pub/rocky/10/images/x86_64/CHECKSUM
      '9':
        filename: Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
        image_url: https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
        sums_url: https://download.rockylinux.org/pub/rocky/9/images/x86_64/CHECKSUM
  almalinux:
    label: AlmaLinux
    family: rpm
    repo_dir: almalinux
    gpg_key_id: RPM-GPG-KEY-AlmaLinux
    upstream_key_url: https://repo.almalinux.org/almalinux
    versions:
      '10':
        filename: AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
        image_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
        sums_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
      '9':
        filename: AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
        image_url: https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
        sums_url: https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/CHECKSUM
  opensuse:
    label: openSUSE Leap
    family: suse
    repo_dir: opensuse/opensuse
    versions:
      '16':
        filename: Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
        image_url: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
        sums_url: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2.sha256
