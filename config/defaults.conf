# =====================================================================
# template-generator defaults
# Sourced by build.sh. Override any value here or via CLI flags.
# =====================================================================

# Your private mirror (verified working for ubuntu/debian/almalinux/rocky/epel)
MIRROR_URL="http://mirror.biznetgio.com"

# Final template disk size (virt-resize grows the image to this).
# Must be LARGER than the base image: Rocky/AlmaLinux GenericCloud images
# are already 10 GiB, so 10G fails with "deficit of ..." in virt-resize.
DISK_SIZE="20G"

# Directories
OUTPUT_DIR="${SCRIPT_DIR}/output"
CACHE_DIR="${SCRIPT_DIR}/cache"

# Optional: admin user created in every template (empty = skip)
# ADMIN_SSH_KEY_FILE must contain a PUBLIC key
ADMIN_USER=""
ADMIN_SSH_KEY_FILE=""

# Optional: emergency root password baked into the template (leave empty!
# rely on CloudStack password feature / your own user-data instead)
ROOT_PASSWORD=""

# Optional: timezone for guests, e.g. "Asia/Jakarta" (empty = UTC default)
TIMEZONE=""

# Patching behaviour (overridable via CLI)
#   1 = always patch kernel+openssh against the mirror (default)
#   Can be skipped per-build with --no-patch, widened with --full-update
PATCH_KERNEL_OPENSSH=1
FULL_UPDATE=0
